name: Package installable Moodle plugin and auto-release

on: [push]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release version from commit message
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$COMMIT_MESSAGE" | grep -Eq '^V [0-9]+\.[0-9]+\.[0-9]+$'; then
            version=$(printf '%s' "$COMMIT_MESSAGE" | sed -nE 's/^V ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and verify Moodle-installable ZIP
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="local_contentfreshness.zip"
          if [[ -n "$VERSION" ]]; then
            archive="local_contentfreshness_$VERSION.zip"
          fi

          # GitHub-generated source archives use the repository name as their
          # root directory, which Moodle rejects with rootdirinvalid.
          # Every file in this archive must live under contentfreshness/.
          git archive --format=zip --prefix=contentfreshness/ -o "$archive" HEAD
          unzip -tq "$archive"
          entries="$(unzip -Z1 "$archive")"
          if ! grep -Fxq 'contentfreshness/version.php' <<< "$entries"; then
            echo "Missing contentfreshness/version.php in $archive" >&2
            exit 1
          fi
          if grep -v '^contentfreshness/' <<< "$entries"; then
            echo "Unexpected ZIP entry outside contentfreshness/" >&2
            exit 1
          fi
          echo "file=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload installable ZIP for every push
        uses: actions/upload-artifact@v4
        with:
          name: contentfreshness-installable
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Create annotated version tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Publish release with Moodle-installable ZIP
        if: steps.version.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: ${{ steps.package.outputs.file }}
          fail_on_unmatched_files: true
          body: |
            Moodle-installable ZIP: ${{ steps.package.outputs.file }}

            Use the attached ZIP, not GitHub's auto-generated "Source code (zip)".
            The attached archive has contentfreshness/ as its root folder.
